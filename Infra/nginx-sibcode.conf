# СибКонтур. Отдельный vhost, не трогает api.yarolit.ru/drones и остальные сайты.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yarolit.ru;

    ssl_certificate /etc/letsencrypt/live/yarolit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yarolit.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/sibcode.access.log api_log;
    error_log /var/log/nginx/sibcode.error.log warn;

    client_max_body_size 200M;
    client_body_timeout 300s;

    # /db-api/api/auth/login -> 127.0.0.1:8001/api/auth/login
    location /db-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

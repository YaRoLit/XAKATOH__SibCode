name: dronemon-api

services:
  api:
    build: .
    container_name: dronemon-api
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/tmp/uploads
      - s3_storage:/s3-storage
    networks: [dronemon_net]
    restart: unless-stopped

volumes:
  uploads:
  s3_storage:

networks:
  dronemon_net:
    external: true